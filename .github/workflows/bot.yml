name: Vibe Bot

on:
  schedule:
    - cron: "15 */5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibe-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Instagram cookies
        if: ${{ secrets.IG_COOKIES_B64 != '' }}
        run: echo "${{ secrets.IG_COOKIES_B64 }}" | base64 -d > cookies.txt

      - name: Run bot
        env:
          VIBE_BOT_TOKEN: ${{ secrets.VIBE_BOT_TOKEN }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTPS_PROXY }}
        run: python bot.py
